apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
spec:
  serviceName: "postgres"
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: tenjin-db
          image: "{{ .Values.postgres.image | default "postgres:13" }}"
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-postgres-config
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: {{ .Release.Name }}-postgres
        annotations:
          "helm.sh/resource-policy": keep  # Prevents PVC deletion when StatefulSet is deleted
      spec:
        accessModes:
          - "{{ .Values.postgres.persistence.accessModes | default "ReadWriteOnce" }}"
        storageClassName: "{{ .Values.postgres.persistence.storageClassName | default "standard" }}"
        resources:
          requests:
            storage: "{{ .Values.postgres.persistence.size | default "10Gi" }}"
