apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: tenjin-pgadmin-gw
spec:
  gateways:
    - istio-system/gw-uat-bankdhofar-com
  hosts:
    - tenjin-pg-admin.uat.bankdhofar.com
  http:
    - match:
        - headers:
            host:
              exact: tenjin-pg-admin.uat.bankdhofar.com
      route:
        - destination:
            host: tenjin-pgadmin
            port:
              number: 80
      timeout: 300s
