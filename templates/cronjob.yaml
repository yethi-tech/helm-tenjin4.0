apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-db-init-job
spec:
  schedule: "0 0 1 1 *"  # Run at 00:00 on Jan 1st every year
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: db-updater
              image: postgres:13
              command:
                - /bin/sh
                - -c
                - |-
                  echo "Waiting for PostgreSQL to be ready...";
                  until pg_isready -h {{ .Release.Name }}-postgres -U "yethi" -d "tenjin"; do
                    sleep 5;
                  done;

                  echo "Sleeping extra 20s for services to settle...";
                  sleep 20;

                  export PGPASSWORD="Yethi123"

                  echo "Running migration query..."

                  psql -h {{ .Release.Name }}-postgres -U "yethi" -d "tenjin" -c "UPDATE sys_users SET last_login_time = '2025-09-29 15:15:42.392526', failed_attempt = '0', is_locked = false;"

                  echo "Migration query executed successfully."
